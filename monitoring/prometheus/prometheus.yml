global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "springboot"

    metrics_path: /actuator/prometheus

    static_configs:
      - targets:
          - springboot-app:8080

  - job_name: "node"

    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor

    static_configs:
      - targets:
          - cadvisor:8080