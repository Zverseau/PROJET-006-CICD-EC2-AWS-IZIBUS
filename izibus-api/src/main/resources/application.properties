spring.application.name=izibus
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=TRACE

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

app.secret-key=${APP_SECRET_KEY}
app.expirationTime=${APP_EXPIRATION_TIME}


# Exposer les endpoints Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Afficher les d�tails de l'�tat de sant�
management.endpoint.health.show-details=always

# Ajouter un tag sur toutes les m�triques
management.metrics.tags.application=izibus

# Activer l'export Prometheus
management.prometheus.metrics.export.enabled=true